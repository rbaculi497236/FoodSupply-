name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Tests/FoodSupply.Tests.csproj
      - run: dotnet build FoodSupply.csproj --no-restore --configuration Release
      - run: dotnet test Tests/FoodSupply.Tests.csproj --no-restore --configuration Release
